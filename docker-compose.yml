version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: visitor-counter-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-net

  flask-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visitor-counter-flask
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ENVIRONMENT_NAME=Docker Compose (Local)
      - APP_VERSION=v1.0.0
      - PORT=5000
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-net

volumes:
  redis_data:
    driver: local

networks:
  app-net:
    driver: bridge
